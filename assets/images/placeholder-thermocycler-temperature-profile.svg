<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Placeholder for thermocycler temperature time profile</title>
<desc id="desc">Placeholder for temperature versus time trace with PCR phases.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#eaf8f8"/>
  </linearGradient>
  <style>
    .card{fill:url(#bg);stroke:#c9dedf;stroke-width:1.4}.ink{fill:#082325}.muted{fill:#59777b}.teal{fill:#08708b}.line{stroke:#08708b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#d9e9ea;stroke-width:1}.dash{stroke:#8bbdc7;stroke-width:2;stroke-dasharray:6 6;fill:none}.label{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em}.small{font-family:Inter,Arial,sans-serif;font-weight:650;font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:760;font-size:11px;letter-spacing:.08em}
  </style>
</defs>

<rect width="900" height="430" rx="28" class="card"/>
<text x="36" y="42" class="label ink">TEMPERATURE–TIME TRACE SLOT</text>
<text x="36" y="66" class="small muted">Temperature trace frame: setpoint, measured temperature, overshoot, ramp rate, and hold band.</text>
<g transform="translate(90 105)">
  <line x1="0" y1="245" x2="720" y2="245" stroke="#27484c" stroke-width="2"/>
  <line x1="0" y1="245" x2="0" y2="25" stroke="#27484c" stroke-width="2"/>
  <g class="grid"><line x1="0" y1="70" x2="720" y2="70"/><line x1="0" y1="135" x2="720" y2="135"/><line x1="0" y1="200" x2="720" y2="200"/><line x1="180" y1="25" x2="180" y2="245"/><line x1="360" y1="25" x2="360" y2="245"/><line x1="540" y1="25" x2="540" y2="245"/></g>
  <path class="dash" d="M0 58 L140 58 L190 170 L330 170 L380 115 L520 115 L585 58 L720 58"/>
  <path class="line" d="M0 160 C70 148 105 70 150 55 S185 95 190 165 S260 172 330 170 S370 145 382 115 S455 113 520 115 S560 88 585 61 S660 57 720 58"/>
  <text x="48" y="43" class="mono muted">denaturation</text><text x="222" y="192" class="mono muted">annealing</text><text x="410" y="103" class="mono muted">extension</text>
  <text x="500" y="264" class="small muted">time</text>
  <text x="-62" y="31" class="small muted" transform="rotate(-90 -62 31)">temperature</text>
</g>
</svg>
