<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
 <title id="title">Recreated deposition pattern schematic</title>
 <desc id="desc">Comparison of edge-biased deposition versus more uniform porous-substrate deposition.</desc>
 <defs>
 <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef9f8"/></linearGradient>
 <radialGradient id="drop" cx="45%" cy="35%" r="65%"><stop offset="0" stop-color="#dff7fb"/><stop offset="1" stop-color="#84d6e5" stop-opacity="0.35"/></radialGradient>
 <style>
 .panel{fill:url(#panel);stroke:#d9e7e8;stroke-width:1.2}.label{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;fill:#365a60}.body{font:500 15px Inter,Arial,sans-serif;fill:#5d7478}.line{stroke:#9cc7cf;stroke-width:2;fill:none}.node{fill:#0d8eb1;opacity:.65}.device{fill:#184d58;opacity:.55}.rim{fill:none;stroke:#0d8eb1;stroke-width:8;opacity:.34}.substrate{fill:#f8fbfb;stroke:#b8d6d9;stroke-width:2}.micro{fill:#4c936c;opacity:.34}
 </style>
 </defs>
 <rect width="920" height="430" rx="28" fill="#fbfefe"/>
 <rect x="40" y="48" width="385" height="310" rx="24" class="panel"/>
 <rect x="495" y="48" width="385" height="310" rx="24" class="panel"/>
 <text x="68" y="88" class="label">SMOOTH / EVAPORATIVE BASELINE</text>
 <text x="523" y="88" class="label">POROUS BOUNDARY CONDITION TARGET</text>
 <text x="68" y="330" class="body">edge-heavy ring · lower usable center region</text>
 <text x="523" y="330" class="body">smaller footprint · more useful central deposition</text>
 <ellipse cx="232" cy="204" rx="112" ry="64" fill="url(#drop)" stroke="#b6dce3" stroke-width="2"/>
 <ellipse cx="232" cy="220" rx="126" ry="78" class="rim"/>
 <rect x="112" y="282" width="240" height="16" rx="8" class="substrate"/>
 <g>
 <circle cx="131" cy="218" r="5" class="device"/><circle cx="151" cy="244" r="4" class="device"/><circle cx="174" cy="266" r="5" class="device"/><circle cx="291" cy="266" r="4" class="device"/><circle cx="318" cy="244" r="5" class="device"/><circle cx="334" cy="217" r="4" class="device"/><circle cx="232" cy="211" r="3" class="device" opacity=".22"/>
 <circle cx="213" cy="219" r="3" class="device" opacity=".18"/><circle cx="252" cy="226" r="3" class="device" opacity=".18"/>
 </g>
 <ellipse cx="688" cy="204" rx="92" ry="54" fill="url(#drop)" stroke="#b6dce3" stroke-width="2"/>
 <rect x="576" y="282" width="224" height="16" rx="8" class="substrate"/>
 <g>
 <circle cx="625" cy="216" r="4" class="device"/><circle cx="649" cy="222" r="4" class="device"/><circle cx="675" cy="208" r="4" class="device"/><circle cx="700" cy="224" r="4" class="device"/><circle cx="724" cy="211" r="4" class="device"/><circle cx="744" cy="229" r="4" class="device"/><circle cx="666" cy="244" r="3.8" class="device"/><circle cx="710" cy="247" r="3.8" class="device"/>
 </g>
 <g opacity=".55">
 <circle cx="594" cy="294" r="3" class="micro"/><circle cx="618" cy="294" r="3" class="micro"/><circle cx="642" cy="294" r="3" class="micro"/><circle cx="666" cy="294" r="3" class="micro"/><circle cx="690" cy="294" r="3" class="micro"/><circle cx="714" cy="294" r="3" class="micro"/><circle cx="738" cy="294" r="3" class="micro"/><circle cx="762" cy="294" r="3" class="micro"/>
 </g>
 <path d="M688 260 C688 282 688 298 688 318" class="line" opacity=".65"/>
 <path d="M676 306 L688 320 L700 306" fill="none" stroke="#4c936c" stroke-width="2" opacity=".65"/>
 <text x="40" y="392" class="body">representative public schematic for edge/center deposition logic.</text>
</svg>
