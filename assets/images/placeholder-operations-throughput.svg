<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Placeholder for operations throughput visualization</title>
<desc id="desc">Placeholder before-after chart and bottleneck map for operations throughput.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#eaf8f8"/>
  </linearGradient>
  <style>
    .card{fill:url(#bg);stroke:#c9dedf;stroke-width:1.4}.ink{fill:#082325}.muted{fill:#59777b}.teal{fill:#08708b}.line{stroke:#08708b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#d9e9ea;stroke-width:1}.dash{stroke:#8bbdc7;stroke-width:2;stroke-dasharray:6 6;fill:none}.label{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em}.small{font-family:Inter,Arial,sans-serif;font-weight:650;font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:760;font-size:11px;letter-spacing:.08em}
  </style>
</defs>

<rect width="900" height="420" rx="28" class="card"/>
<text x="36" y="42" class="label ink">OPERATIONS EVIDENCE SLOT</text>
<text x="36" y="66" class="small muted">Shift-log, before/after throughput, or bottleneck map can be added here.</text>
<g transform="translate(70 105)">
  <rect x="0" y="0" width="330" height="240" rx="22" fill="#fff" stroke="#d4e6e8"/>
  <text x="24" y="34" class="mono muted">BEFORE / AFTER</text>
  <line x1="45" y1="198" x2="285" y2="198" stroke="#27484c" stroke-width="2"/>
  <rect x="92" y="108" width="52" height="90" rx="8" fill="#8bbdc7" opacity=".65"/>
  <rect x="188" y="70" width="52" height="128" rx="8" fill="#08708b" opacity=".78"/>
  <text x="78" y="222" class="small muted">before</text><text x="181" y="222" class="small muted">after</text>
  <text x="238" y="76" class="mono teal">+20%</text>
  <rect x="380" y="0" width="410" height="240" rx="22" fill="#fff" stroke="#d4e6e8"/>
  <text x="404" y="34" class="mono muted">DRIVE-THROUGH BOTTLENECK MAP</text>
  <g class="small muted" font-family="Inter,Arial,sans-serif"><rect x="418" y="78" width="92" height="54" rx="14" fill="#f3fbfb" stroke="#cce1e3"/><text x="439" y="110">order</text><rect x="548" y="78" width="92" height="54" rx="14" fill="#fff8e5" stroke="#e7d99d"/><text x="574" y="110">pay</text><rect x="678" y="78" width="92" height="54" rx="14" fill="#f3fbfb" stroke="#cce1e3"/><text x="701" y="110">handoff</text><path d="M510 105 L548 105 M640 105 L678 105" stroke="#8bbdc7" stroke-width="3"/><text x="535" y="166" class="mono muted">highlight constraint + corrective action</text></g>
</g>
</svg>
