<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">DNA flexibility assay concept schematic</title>
<desc id="desc">A short DNA segment bends into a loop beside a simple flexibility versus length plot and PCR control workflow.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eefafa"/></linearGradient>
 <style>.small{font:800 13px ui-monospace,Menlo,monospace;fill:#08708b;letter-spacing:.09em}.label{font:750 20px Inter,Arial,sans-serif;fill:#0f2d31;letter-spacing:-.02em}.body{font:600 14px Inter,Arial,sans-serif;fill:#5f7679}.card{fill:#fff;stroke:#08708b;stroke-opacity:.15}.helix1{fill:none;stroke:#08708b;stroke-width:6;stroke-linecap:round}.helix2{fill:none;stroke:#4c936c;stroke-width:6;stroke-linecap:round}.rung{stroke:#0f2d31;stroke-opacity:.18;stroke-width:3}.curve{fill:none;stroke:#08708b;stroke-width:5;stroke-linecap:round}.axis{stroke:#0f2d31;stroke-opacity:.22;stroke-width:2}</style>
</defs>
<rect width="920" height="420" rx="34" fill="url(#bg)"/>
<g transform="translate(64 74)">
 <text x="0" y="0" class="small">SHORT-LENGTH DNA MECHANICS</text>
 <path d="M70 88 C28 116 28 206 90 230 C158 256 248 206 220 128 C200 72 128 52 70 88Z" class="helix1"/>
 <path d="M88 106 C58 132 58 192 104 210 C154 232 222 194 202 138 C188 98 130 82 88 106Z" class="helix2" opacity=".86"/>
 <g><line x1="82" y1="105" x2="99" y2="124" class="rung"/><line x1="48" y1="154" x2="74" y2="160" class="rung"/><line x1="82" y1="225" x2="99" y2="206" class="rung"/><line x1="166" y1="226" x2="157" y2="205" class="rung"/><line x1="221" y1="154" x2="199" y2="158" class="rung"/><line x1="190" y1="88" x2="174" y2="106" class="rung"/></g>
 <text x="0" y="310" class="label">assay logic under small-signal constraints</text>
</g>
<g transform="translate(420 68)">
 <rect width="420" height="140" rx="26" class="card"/>
 <text x="26" y="38" class="small">WORKFLOW</text>
 <text x="26" y="72" class="body">sample design → PCR workflow → controls → readout → troubleshooting loop</text>
 <g transform="translate(34 96)"><circle cx="0" cy="0" r="7" fill="#08708b"/><line x1="10" y1="0" x2="88" y2="0" stroke="#08708b" stroke-opacity=".35" stroke-width="3"/><circle cx="102" cy="0" r="7" fill="#08708b"/><line x1="112" y1="0" x2="190" y2="0" stroke="#08708b" stroke-opacity=".35" stroke-width="3"/><circle cx="204" cy="0" r="7" fill="#4c936c"/><line x1="214" y1="0" x2="292" y2="0" stroke="#08708b" stroke-opacity=".35" stroke-width="3"/><circle cx="306" cy="0" r="7" fill="#d4a72c"/></g>
</g>
<g transform="translate(420 238)">
 <rect width="420" height="118" rx="26" class="card"/>
 <text x="26" y="38" class="small">READOUT CONCEPT</text>
 <line x1="42" y1="90" x2="340" y2="90" class="axis"/><line x1="42" y1="90" x2="42" y2="56" class="axis"/>
 <path d="M48 84 C90 82 114 68 150 70 S210 88 250 64 S298 54 344 58" class="curve"/>
 <text x="284" y="38" class="body">flexibility vs. length</text>
</g>
</svg>
