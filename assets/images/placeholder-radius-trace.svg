<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Planned normalized contact-line radius trace</title>
<desc id="desc">Graph frame for r(t)/r0 versus normalized time.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#eaf8f8"/>
  </linearGradient>
  <style>
    .card{fill:url(#bg);stroke:#c9dedf;stroke-width:1.4}.ink{fill:#082325}.muted{fill:#59777b}.teal{fill:#08708b}.line{stroke:#08708b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#d9e9ea;stroke-width:1}.dash{stroke:#8bbdc7;stroke-width:2;stroke-dasharray:6 6;fill:none}.label{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em}.small{font-family:Inter,Arial,sans-serif;font-weight:650;font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:760;font-size:11px;letter-spacing:.08em}
  </style>
</defs>

<rect width="760" height="430" rx="28" class="card"/>
<text x="34" y="42" class="label ink">Contact-line dynamics</text>
<text x="34" y="66" class="small muted">r(t)/r₀ vs. normalized time across substrate/backing conditions.</text>
<g transform="translate(90 100)">
  <line x1="0" y1="250" x2="580" y2="250" stroke="#27484c" stroke-width="2"/>
  <line x1="0" y1="250" x2="0" y2="20" stroke="#27484c" stroke-width="2"/>
  <g class="grid"><line x1="0" y1="200" x2="580" y2="200"/><line x1="0" y1="150" x2="580" y2="150"/><line x1="0" y1="100" x2="580" y2="100"/><line x1="0" y1="50" x2="580" y2="50"/><line x1="145" y1="20" x2="145" y2="250"/><line x1="290" y1="20" x2="290" y2="250"/><line x1="435" y1="20" x2="435" y2="250"/></g>
  <path class="dash" d="M0 82 C130 84 245 86 360 92 S520 120 580 166"/>
  <path class="line" d="M0 82 C80 82 160 84 238 88 S370 120 580 220" opacity=".9"/>
  <text x="215" y="286" class="small muted">normalized time</text>
  <text x="-58" y="20" class="small muted" transform="rotate(-90 -58 20)">r(t)/r₀</text>
  <text x="365" y="70" class="mono muted">condition traces</text>
</g>
</svg>
