<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title>Simulation decision schematic slot</title><desc>Use for flowsheet logic, balances, assumptions, and decision outputs.</desc>
<rect width="1200" height="760" fill="#f8fbfc"/>
<rect x="46" y="46" width="1108" height="668" rx="32" fill="#fff" stroke="#d8e2e7" stroke-width="2"/>
<text x="76" y="108" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">Simulation decision schematic slot</text>
<text x="76" y="150" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="20">Use for flowsheet logic, balances, assumptions, and decision outputs.</text>
<g transform="translate(86,252)">
<defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#08708b"/></marker></defs>
<rect x="0" y="0" width="190" height="120" rx="24" fill="#fff" stroke="#d8e2e7"/><text x="95" y="52" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">INPUT</text><text x="95" y="84" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">condition</text><rect x="250" y="0" width="190" height="120" rx="24" fill="#fff" stroke="#d8e2e7"/><text x="345" y="52" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">MEASURE</text><text x="345" y="84" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">CTQ</text><rect x="500" y="0" width="190" height="120" rx="24" fill="#fff" stroke="#d8e2e7"/><text x="595" y="52" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">CLASSIFY</text><text x="595" y="84" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">state</text><rect x="750" y="0" width="190" height="120" rx="24" fill="#fff" stroke="#d8e2e7"/><text x="845" y="52" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">DECIDE</text><text x="845" y="84" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">next run</text><line x1="190" y1="60" x2="242" y2="60" stroke="#08708b" stroke-width="4" marker-end="url(#arrow)"/><line x1="440" y1="60" x2="492" y2="60" stroke="#08708b" stroke-width="4" marker-end="url(#arrow)"/><line x1="690" y1="60" x2="742" y2="60" stroke="#08708b" stroke-width="4" marker-end="url(#arrow)"/>
